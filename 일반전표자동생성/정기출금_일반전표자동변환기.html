<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정기출금 → 일반전표 자동변환기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --border:#e2e5ea; --text:#1f2430; --muted:#6b7280;
    --accent:#2563eb; --accent-dark:#1d4ed8; --danger:#dc2626; --danger-bg:#fef2f2;
    --ok:#16a34a; --ok-bg:#f0fdf4; --warn-bg:#fffbeb; --warn:#b45309;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Malgun Gothic,sans-serif;
    background:var(--bg); color:var(--text); padding:24px; line-height:1.5;
  }
  .wrap{max-width:980px; margin:0 auto;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:24px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .card h2{font-size:15px; margin:0 0 14px; display:flex; align-items:center; gap:8px;}
  .card h2 .badge{
    font-size:11px; font-weight:600; background:#eef2ff; color:var(--accent-dark);
    padding:2px 8px; border-radius:999px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .field{display:flex; flex-direction:column; gap:4px;}
  label{font-size:12px; color:var(--muted);}
  input[type=text], input[type=file]{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px;
    background:#fff; color:var(--text);
  }
  input[type=text]{min-width:140px;}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 16px;
    font-size:13px; font-weight:600; cursor:pointer; transition:background .15s;
  }
  button:hover{background:var(--accent-dark);}
  button.secondary{background:#fff; color:var(--accent); border:1px solid var(--accent);}
  button.secondary:hover{background:#eef2ff;}
  button.ghost{background:#fff; color:var(--muted); border:1px solid var(--border); padding:6px 10px; font-size:12px;}
  button:disabled{background:#d1d5db; cursor:not-allowed;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:4px;}
  .stat{background:#f9fafb; border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .stat .label{font-size:11px; color:var(--muted); margin-bottom:4px;}
  .stat .value{font-size:17px; font-weight:700;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
  th,td{border-bottom:1px solid var(--border); padding:7px 8px; text-align:left; white-space:nowrap;}
  th{background:#f9fafb; color:var(--muted); font-weight:600; position:sticky; top:0;}
  .table-scroll{max-height:340px; overflow:auto; border:1px solid var(--border); border-radius:8px;}
  .pill{display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600;}
  .pill.ok{background:var(--ok-bg); color:var(--ok);}
  .pill.warn{background:var(--warn-bg); color:var(--warn);}
  .pill.danger{background:var(--danger-bg); color:var(--danger);}
  .fail-row input{width:110px;}
  .msg{font-size:12.5px; padding:8px 12px; border-radius:8px; margin-top:8px;}
  .msg.ok{background:var(--ok-bg); color:var(--ok);}
  .msg.err{background:var(--danger-bg); color:var(--danger);}
  .muted{color:var(--muted); font-size:12px;}
  .divider{height:1px; background:var(--border); margin:14px 0;}
  .download-bar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .search-results{margin-top:8px;}
  code{background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>정기출금 → 더존 일반전표입력 변환기</h1>
  <div class="sub">정기출금 엑셀을 업로드하면 거래처코드를 자동 매칭해서 더존위하고 일반전표입력 업로드용 엑셀을 만들어줍니다.</div>

  <div class="card">

      <div class="field"><label>사업자번호</label><input type="text" id="newBiz" placeholder="예: 123-45-67890"></div>
      <div class="field"><label>대표자 (선택)</label><input type="text" id="newRep" placeholder="예: 홍길동"></div>
      <div class="field"><label>&nbsp;</label><button onclick="addVendor()">추가</button></div>

      </div>

  <div class="card">

<script>
/* ============ 고정값 ============ */
const FIXED = {
  bankVendorCode: '98005',      // 보통예금/지급수수료 거래처코드 (기업은행 341-057820-01-014)
  acc_deposit: 103,             // 보통예금
  acc_fee: 831,                 // 지급수수료
  acc_receivable: 108,          // 외상매출금
  defaultFailFee: 20            // 미출금건 기본 수수료(파일에 값 없을 때)
};

/* ============ 매칭 로직 ============ */
function isExcludedName(name){
  if(!name) return false;
  const s = String(name).trim();
  if(!s) return false;
  const suffixStripped = s.replace(/[\s)\-_]+$/, '');
  const prefixStripped = s.replace(/^[\s(\-_]+/, '');
  const suffixFlag = suffixStripped.length>0 && suffixStripped.slice(-1).toUpperCase()==='X';
  const prefixFlag = prefixStripped.length>0 && prefixStripped.slice(0,1).toUpperCase()==='X';
  return suffixFlag || prefixFlag;
}
function normBiz(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/-/g,'').trim();
}
function isBlankName(rep){
  if(!rep) return true;
  const s = String(rep).trim();
  return s==='' || s==='이름없음';
}
function buildGroups(vendors){
  const bizGroups = new Map();
  const nameGroups = new Map();
  for(const v of vendors){
    if(isExcludedName(v.n)) continue;
    if(v.isJumin){
      const key = String(v.n||'').trim();
      if(!key) continue;
      if(!nameGroups.has(key)) nameGroups.set(key, []);
      nameGroups.get(key).push(v);
    } else {
      if(!v.b) continue;
      if(!bizGroups.has(v.b)) bizGroups.set(v.b, []);
      bizGroups.get(v.b).push(v);
    }
  }
  return { bizGroups, nameGroups };
}
function resolveGroup(group, depositor, company){
  let cur = group.filter(c=>c.u===1);
  if(cur.length===0) cur = group;
  if(cur.length===1) return { code: cur[0].c, remaining: cur };

  const named = cur.filter(c=>!isBlankName(c.r));
  if(named.length===1) return { code: named[0].c, remaining: cur };
  const cur2 = named.length>0 ? named : cur;

  const dep = depositor ? String(depositor).trim() : '';
  const comp = company ? String(company).trim() : '';

  if(dep){
    const exact = cur2.filter(c=>String(c.n||'').trim()===dep);
    if(exact.length===1) return { code: exact[0].c, remaining: cur };
  }
  if(dep){
    const m = cur2.filter(c=>{
      if(isBlankName(c.r)) return false;
      const rep = String(c.r).trim();
      return dep.includes(rep) || rep.includes(dep);
    });
    if(m.length===1) return { code: m[0].c, remaining: cur };
  }
  if(dep){
    const m = cur2.filter(c=>{
      const n = String(c.n||'').trim();
      return n && (dep.includes(n) || n.includes(dep));
    });
    if(m.length===1) return { code: m[0].c, remaining: cur };
  }
  if(comp){
    const m = cur2.filter(c=>{
      const n = String(c.n||'').trim();
      return n && (comp.includes(n) || n.includes(comp));
    });
    if(m.length===1) return { code: m[0].c, remaining: cur };
  }
  return { code: null, remaining: cur };
}
function matchVendorForTx(tx, groups){
  const { bizGroups, nameGroups } = groups;
  const norm = normBiz(tx.bizraw);
  if(norm && bizGroups.has(norm)){
    const group = bizGroups.get(norm);
    if(group.length===1) return { code: group[0].c, method:'사업자번호' };
    const { code, remaining } = resolveGroup(group, tx.depositor, tx.company);
    if(code) return { code, method:'사업자번호(자동판별)' };
    const codes = Array.from(new Set(remaining.map(c=>c.c))).sort();
    return { code:'', method:'확인필요', candidates: codes };
  }
  const candKey = tx.company ? String(tx.company).trim() : '';
  let group = nameGroups.get(candKey);
  if(!group && tx.name) group = nameGroups.get(String(tx.name).trim());
  if(group){
    if(group.length===1) return { code: group[0].c, method:'거래처명(주민번호)' };
    const { code, remaining } = resolveGroup(group, tx.depositor, tx.company);
    if(code) return { code, method:'거래처명(자동판별)' };
    const codes = Array.from(new Set(remaining.map(c=>c.c))).sort();
    return { code:'', method:'확인필요', candidates: codes };
  }
  return { code:'', method:'매칭없음', candidates: [] };
}
function parseVendorWorkbook(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
  const vendors = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length===0) continue;
    const code=r[0], name=r[1], idtype=r[2], idraw=r[3], rep=r[4], use=r[6];
    if(code===null||code===undefined||code==='') continue;
    const isJumin = idtype==='1.주민등록번호';
    const isBizT = idtype==='0.사업자등록번호';
    if(!isJumin && !isBizT) continue;
    if(isBizT && (!idraw || String(idraw).trim()==='')) continue;
    vendors.push({
      c:String(code), n:name, b:isBizT?normBiz(idraw):'', r:rep,
      u: use==='0. O' ? 1 : 0, isJumin: isJumin
    });
  }
  return vendors;
}

let vendors = [];

/* ============ 저장소 ============ */
async function loadVendors(){
  try{
    const res = await window.storage.get('vendors_v1', false);
    if(res && res.value){
      const raw = JSON.parse(res.value);
      vendors = rawToVendors(raw);
      vendorSource = '저장된 데이터 (' + vendors.length + '건)';
    } else {
      throw new Error('no data');
    }
  } catch(e){
    vendors = rawToVendors(DEFAULT_VENDORS_RAW);
    vendorSource = '기본 내장 데이터 (' + vendors.length + '건) — 최초 1회 저장 중';
    await saveVendors();
  }
  groups = buildGroups(vendors);
  updateVendorUI();
}
async function saveVendors(){
  const raw = vendors.map(v=>[v.c,v.n,v.b,v.r,v.u,v.isJumin?1:0]);
  try{
    await window.storage.set('vendors_v1', JSON.stringify(raw), false);
  }catch(e){
    console.error('저장 실패', e);
  }
}
function updateVendorUI(){
  document.getElementById('vendorCountBadge').textContent = vendors.length + '건';
  document.getElementById('vendorSourceInfo').textContent = vendorSource;
}

/* ============ 거래처 관리 UI ============ */
document.getElementById('vendorFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const msgEl = document.getElementById('vendorUploadMsg');
  msgEl.innerHTML = '<div class="msg">처리 중…</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const newVendors = parseVendorWorkbook(wb);
    if(newVendors.length===0){
      msgEl.innerHTML = '<div class="msg err">거래처 데이터를 찾지 못했습니다. 양식을 확인해주세요.</div>';
      return;
    }
    vendors = newVendors;
    groups = buildGroups(vendors);
    vendorSource = '업로드한 파일로 교체됨 (' + vendors.length + '건)';
    await saveVendors();
    updateVendorUI();
    msgEl.innerHTML = '<div class="msg ok">거래처등록 데이터를 ' + vendors.length + '건으로 교체했습니다.</div>';
  }catch(err){
    console.error(err);
    msgEl.innerHTML = '<div class="msg err">파일을 읽는 중 오류가 발생했습니다: ' + err.message + '</div>';
  }
});

async function addVendor(){
  const code = document.getElementById('newCode').value.trim();
  const name = document.getElementById('newName').value.trim();
  const biz = document.getElementById('newBiz').value.trim();
  const rep = document.getElementById('newRep').value.trim();
  const msgEl = document.getElementById('addVendorMsg');
  if(!code || !name || !biz){
    msgEl.innerHTML = '<div class="msg err">코드, 거래처명, 사업자번호는 필수입니다.</div>';
    return;
  }
  const normed = normBiz(biz);
  vendors.push({ c: code, n: name, b: normed, r: rep, u: 1, isJumin: false });
  groups = buildGroups(vendors);
  await saveVendors();
  updateVendorUI();
  msgEl.innerHTML = '<div class="msg ok">"' + name + '" (코드 ' + code + ') 추가되었습니다.</div>';
  document.getElementById('newCode').value='';
  document.getElementById('newName').value='';
  document.getElementById('newBiz').value='';
  document.getElementById('newRep').value='';
  renderVendorSearch();
}

function renderVendorSearch(){
  const q = document.getElementById('vendorSearch').value.trim();
  const box = document.getElementById('vendorSearchResults');
  if(!q){ box.innerHTML=''; return; }
  const ql = q.toLowerCase();
  const results = vendors.filter(v=>
    (v.c && v.c.toLowerCase().includes(ql)) ||
    (v.n && String(v.n).toLowerCase().includes(ql)) ||
    (v.b && v.b.includes(q.replace(/-/g,'')))
  ).slice(0,30);
  if(results.length===0){
    box.innerHTML = '<div class="muted">검색 결과가 없습니다.</div>';
    return;
  }
  let html = '<div class="table-scroll" style="max-height:220px;"><table><thead><tr><th>코드</th><th>거래처명</th><th>사업자/주민</th><th>대표자</th><th>사용</th></tr></thead><tbody>';
  for(const v of results){
    html += '<tr><td>'+v.c+'</td><td>'+(v.n||'')+'</td><td>'+(v.isJumin?'(주민번호)':(v.b||''))+'</td><td>'+(v.r||'')+'</td><td>'+(v.u===1?'O':'X')+'</td></tr>';
  }
  html += '</tbody></table></div>';
  box.innerHTML = html;
}

/* ============ 날짜 유틸 ============ */
function nextBusinessDay(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate()+1);
  const day = d.getDay();
  if(day===6) d.setDate(d.getDate()+2);
  else if(day===0) d.setDate(d.getDate()+1);
  return d;
}
function fmtWon(n){
  return Math.round(n).toLocaleString('ko-KR') + '원';
}

/* ============ 정기출금 파일 처리 ============ */
document.getElementById('txFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const msgEl = document.getElementById('txUploadMsg');
  msgEl.innerHTML = '<div class="msg">처리 중…</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
    processTxRows(rows);
    msgEl.innerHTML = '<div class="msg ok">처리 완료. 아래 결과를 확인해주세요.</div>';
  }catch(err){
    console.error(err);
    msgEl.innerHTML = '<div class="msg err">파일을 읽는 중 오류가 발생했습니다: ' + err.message + '</div>';
  }
});

function processTxRows(rows){
  manualCodes = {};
  txRows = [];
  let totalSuccessAmt = 0;
  let feeSuccessSum = 0;
  let feeFailSum = 0;
  let successCnt = 0, failCnt = 0;
  let refDateStr = null;

  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length===0) continue;
    const mgmt = r[0];
    if(mgmt===null || mgmt===undefined || mgmt==='' || mgmt==='소계') continue;

    const name=r[1], company=r[2], bizraw=r[6], depositor=r[10];
    const successAmt = Number(r[18])||0;
    const successCntRaw = r[19];
    let successCntNum = 0;
    try{ successCntNum = parseInt(successCntRaw); if(isNaN(successCntNum)) successCntNum=0; }catch(e){successCntNum=0;}
    const isSuccess = successCntNum>=1 && successAmt>0;
    let rawFee = r[20];
    let feeUsed;
    if(rawFee===null || rawFee===undefined || rawFee===''){
      feeUsed = isSuccess ? 0 : FIXED.defaultFailFee;
    } else {
      feeUsed = Number(rawFee);
    }
    const txDate = r[26] ? String(r[26]).trim() : null;
    if(!refDateStr && txDate) refDateStr = txDate;

    if(isSuccess){
      totalSuccessAmt += successAmt;
      feeSuccessSum += feeUsed;
      successCnt++;
    } else {
      feeFailSum += feeUsed;
      failCnt++;
    }

    const match = matchVendorForTx({ bizraw, company, name, depositor }, groups);
    txRows.push({
      mgmt: String(mgmt), name, company, bizraw, depositor,
      successAmt, isSuccess, fee: feeUsed,
      code: match.code, method: match.method, candidates: match.candidates||[],
      txDate: txDate || refDateStr
    });
  }

  const totalFeeAll = feeSuccessSum + feeFailSum;
  const netDeposit = totalSuccessAmt - totalFeeAll;

  // 연월 시트명
  if(refDateStr){
    const parts = refDateStr.split('-');
    const yy = String(parseInt(parts[0])%100);
    const mm = String(parseInt(parts[1]));
    sheetName = yy + '년' + mm + '월';
  } else {
    sheetName = '전표';
  }
  fileName = '일반전표입력_' + sheetName + '.xlsx';

  renderSummary({ totalSuccessAmt, feeSuccessSum, feeFailSum, totalFeeAll, netDeposit, successCnt, failCnt, refDateStr });
  renderFailTable();
  buildFinalEntries();
}

function renderSummary({ totalSuccessAmt, feeSuccessSum, feeFailSum, totalFeeAll, netDeposit, successCnt, failCnt, refDateStr }){
  document.getElementById('summarySection').style.display='block';
  const stats = [
    ['시트명 / 파일명', sheetName], 
    ['출금성공 건수', successCnt+'건'],
    ['미출금(실패) 건수', failCnt+'건'],
    ['총 출금성공금액', fmtWon(totalSuccessAmt)],
    ['성공건 수수료합계', fmtWon(feeSuccessSum)],
    ['미출금건 수수료합계', fmtWon(feeFailSum)],
    ['지급수수료(전체)', fmtWon(totalFeeAll)],
    ['보통예금(순입금액)', fmtWon(netDeposit)],
  ];
  let html='';
  for(const [label,value] of stats){
    html += '<div class="stat"><div class="label">'+label+'</div><div class="value">'+value+'</div></div>';
  }
  document.getElementById('statGrid').innerHTML = html;
}

function renderFailTable(){
  const failRows = txRows.filter(r=>r.isSuccess && (!r.code || r.code===''));
  const card = document.getElementById('failCard');
  if(failRows.length===0){ card.style.display='none'; return; }
  card.style.display='block';
  document.getElementById('failCountBadge').textContent = failRows.length + '건';
  const tbody = document.querySelector('#failTable tbody');
  let html='';
  for(const r of failRows){
    const cands = (r.candidates&&r.candidates.length) ? r.candidates.join(' / ') : '-';
    html += '<tr class="fail-row" data-mgmt="'+r.mgmt+'">'+
      '<td>'+r.mgmt+'</td><td>'+(r.name||'')+'</td><td>'+(r.company||'')+'</td><td>'+(r.bizraw||'-')+'</td>'+
      '<td>'+cands+'</td>'+
      '<td><input type="text" placeholder="코드 입력" onchange="setManualCode(\''+r.mgmt+'\', this.value)"></td>'+
      '</tr>';
  }
  tbody.innerHTML = html;
}

function setManualCode(mgmt, value){
  manualCodes[mgmt] = value.trim();
  buildFinalEntries();
}

function buildFinalEntries(){
  let refDate = null;
  const entries = [];
  let totalSuccessAmt = 0, feeSuccessSum=0, feeFailSum=0;

  for(const r of txRows){
    if(r.isSuccess){
      totalSuccessAmt += r.successAmt;
      feeSuccessSum += r.fee;
      if(!refDate && r.txDate) refDate = r.txDate;
      let code = r.code;
      if((!code || code==='') && manualCodes[r.mgmt]) code = manualCodes[r.mgmt];
      const memo = '정기출금 CMS결제(' + (r.company||r.name||'') + ')' + ((!code)?' [확인필요]':'');
      const d = refDate || r.txDate;
      let y,m,day;
      if(d){ const dt = nextBusinessDay(d); y=dt.getFullYear(); m=dt.getMonth()+1; day=dt.getDate(); }
      else { y='';m='';day=''; }
      entries.push({ y,m,day, gubun:4, code: FIXED.acc_receivable, acc:'외상매출금', vendor: code||'', debit:null, credit:r.successAmt, memo });
    } else {
      feeFailSum += r.fee;
    }
  }
  const totalFeeAll = feeSuccessSum + feeFailSum;
  const netDeposit = totalSuccessAmt - totalFeeAll;

  let y,m,day;
  if(refDate){ const dt = nextBusinessDay(refDate); y=dt.getFullYear(); m=dt.getMonth()+1; day=dt.getDate(); }
  else { y='';m='';day=''; }

  const summaryLines = [
    { y,m,day, gubun:3, code: FIXED.acc_fee, acc:'지급수수료', vendor: FIXED.bankVendorCode, debit: totalFeeAll, credit:null, memo:'정기출금 CMS 수수료(성공+미출금 전체)' },
    { y,m,day, gubun:3, code: FIXED.acc_deposit, acc:'보통예금', vendor: FIXED.bankVendorCode, debit: netDeposit, credit:null, memo:'정기출금 CMS 입금(수수료차감)' },
  ];
  finalEntries = summaryLines.concat(entries);
  renderPreview();
}

function renderPreview(){
  const card = document.getElementById('previewCard');
  if(finalEntries.length===0){ card.style.display='none'; return; }
  card.style.display='block';
  document.getElementById('lineCountBadge').textContent = finalEntries.length + '줄';
  const tbody = document.querySelector('#previewTable tbody');
  let html='';
  let sumDebit=0, sumCredit=0;
  for(const e of finalEntries.slice(0,300)){
    sumDebit += e.debit||0; sumCredit += e.credit||0;
    const vendorCls = (!e.vendor) ? 'style="color:#dc2626;font-weight:600;"' : '';
    html += '<tr><td>'+e.y+'</td><td>'+e.m+'</td><td>'+e.day+'</td><td>'+e.gubun+'</td><td>'+e.code+'</td><td>'+e.acc+'</td>'+
      '<td '+vendorCls+'>'+(e.vendor||'미입력')+'</td><td>'+(e.debit?fmtWon(e.debit):'')+'</td><td>'+(e.credit?fmtWon(e.credit):'')+'</td><td>'+e.memo+'</td></tr>';
  }
  // 전체 합계는 slice 하지 않고 다시 계산
  sumDebit=0; sumCredit=0;
  for(const e of finalEntries){ sumDebit += e.debit||0; sumCredit += e.credit||0; }
  tbody.innerHTML = html;
  const balEl = document.getElementById('balanceCheck');
  const balanced = Math.round(sumDebit)===Math.round(sumCredit);
  balEl.innerHTML = '차변합계 ' + fmtWon(sumDebit) + ' / 대변합계 ' + fmtWon(sumCredit) + ' — ' +
    (balanced ? '<span class="pill ok">일치</span>' : '<span class="pill danger">불일치</span>');
}

function downloadFinal(){
  const headers = ['년','월','일','구분','코드','계정과목','거래처','차변','대변','적요','부서','증빙'];
  const aoa = [headers];
  for(const e of finalEntries){
    aoa.push([e.y, e.m, e.day, e.gubun, e.code, e.acc, e.vendor, e.debit, e.credit, e.memo, null, null]);
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
  XLSX.writeFile(wb, fileName || '일반전표입력.xlsx');
}

loadVendors();
